# A version tag (vX.Y.Z) checks ApduStudio on Windows, Linux and macOS (ci.yml), builds it for
# the three (build.yml, which also starts Linux on its distributions) and publishes the builds as a
# GitHub release. The tag must match the version in Cargo.toml (which the app shows),
# CHANGELOG.md must have a section for it (the release's notes), and the release must not exist
# yet: push the tag with git, since publishing a release from GitHub's Releases page creates the
# tag along with an empty release. All three are checked first, before any build.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: the tag is the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the tag with Cargo.toml
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$cargo_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but Cargo.toml says $cargo_version"
            exit 1
          fi
      - name: The release's notes, from CHANGELOG.md
        run: .github/scripts/changelog-section.sh "${GITHUB_REF_NAME#v}"
      # The last job creates the release, and can't if one exists: tell now, not after the builds.
      - name: No release yet for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::$GITHUB_REF_NAME already has a release, which this workflow creates once everything is built. Delete it, keeping the tag (gh release delete $GITHUB_REF_NAME), then re-run this workflow."
            exit 1
          fi

  check:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      macos: true

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # CHANGELOG.md and the script that reads it, at the tagged commit.
      - uses: actions/checkout@v4
      # Only the builds: the run also keeps the Linux start-up screenshots (screenshot-*).
      - uses: actions/download-artifact@v4
        with:
          pattern: ApduStudio-*
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          .github/scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ApduStudio ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md"
